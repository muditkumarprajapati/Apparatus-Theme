<svg width="2048" height="1373" viewBox="0 0 2048 1373" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
<defs>

      <linearGradient id="cabinWindowGlow" x1="1680" y1="1170" x2="1710" y2="1200" gradientUnits="userSpaceOnUse">
